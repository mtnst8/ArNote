<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ArNote</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6f4f">
<meta name="description" content="ArNote — simple notes kept in your own Google Drive">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1f2328;--mute:#6b6f76;--line:#e3e1dc;--acc:#2f6f4f;--acc2:#e8f1ec;--star:#d99a00;--warn:#b3261e;--shade:rgba(20,22,25,.45)}
@media (prefers-color-scheme:dark){:root{--bg:#16181b;--card:#1f2226;--ink:#e8e6e3;--mute:#9aa0a6;--line:#30343a;--acc:#6cc79a;--acc2:#20352b;--star:#f0b429;--warn:#ff8a80;--shade:rgba(0,0,0,.6)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;align-items:center}
header .brand{font-weight:700;letter-spacing:.3px;cursor:pointer;color:var(--acc)}
header input{flex:1;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:15px}
nav{display:flex;gap:6px;padding:8px 14px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav button,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.danger{color:var(--warn)}
.btn.small{padding:3px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
main{max-width:900px;margin:0 auto;padding:12px 14px 120px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);margin:0}
.lhead{display:flex;align-items:center;gap:8px;margin:18px 0 8px}.lhead h2{flex:1}
.rcpick #ppt .trow[data-tag=""]{display:none}
.rcf{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0 10px}
.rcf select,.rcf input{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-size:14px}
.rcf #rcQ{width:140px}
.rcsum{margin:0 0 10px;font-size:15px}
.rclay{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:800px){.rclay{grid-template-columns:1fr}}
.rcnav{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;font-size:14px;position:sticky;top:8px;max-height:calc(100vh - 24px);overflow:auto}
.rcnav h4{margin:4px 6px 6px;font-size:12px;text-transform:uppercase;letter-spacing:.4px;opacity:.6}
.rcnav select{width:100%;margin:0 0 6px;padding:5px 6px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-size:13px}
.rcn{display:flex;gap:6px;align-items:baseline;padding:6px 8px;border-radius:8px;cursor:pointer}
.rcn:hover{background:rgba(127,127,127,.09)}.rcn.on{background:var(--acc);color:#fff}.rcn.on .muted,.rcn.on .ub2{color:#fff;opacity:.85}
.rcn .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rcn .am{font-variant-numeric:tabular-nums;white-space:nowrap}
.rcn.l2{margin-left:14px;font-size:13px}.ub2{display:block;font-size:11px;color:var(--warn)}
.rccr{margin:0 0 8px;font-size:15px}.rccr button{background:none;border:none;color:var(--acc);font:inherit;cursor:pointer;padding:0}
.rcselbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 10px;margin:0 0 8px;border-radius:10px;background:var(--card);border:1px solid var(--acc)}
.rcpv{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.rcpv img{width:220px;max-width:100%;max-height:320px;object-fit:contain;border-radius:8px;background:#f2f2f2}
.rcpvf{flex:1;min-width:220px}.rcrow{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}.rcrow span{width:90px;opacity:.65;flex:none}
.rcinv{font-size:10px;text-transform:uppercase;letter-spacing:.4px;border:1px solid var(--line);border-radius:6px;padding:1px 5px;opacity:.75;white-space:nowrap}
.rct td.ck,.rct th.ck{width:28px;padding-right:0}.rct .bl{font-size:12px;color:var(--acc);white-space:nowrap}
.rcwrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
.rct{border-collapse:collapse;width:100%;font-size:14px}
.rct th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;opacity:.6;font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.rct td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.rct tbody tr[data-n]{cursor:pointer}
.rct tbody tr[data-n]:hover{background:rgba(127,127,127,.07)}
.rct .n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.rct .rcg td{font-weight:700;background:rgba(127,127,127,.08)}
.rct tfoot td{font-weight:700;border-bottom:0}
.rcw{color:var(--warn);margin-right:4px}
.rcd{display:flex;gap:14px;align-items:flex-start}
.rcd img{width:180px;max-height:300px;object-fit:contain;border-radius:8px;background:#000}
.rcdf{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.rcdf label{display:flex;flex-direction:column;font-size:12px;gap:2px;flex:1}
@media (max-width:600px){.rcd{flex-direction:column}.rcd img{width:100%;max-height:220px}.rct{font-size:13px}.rct td,.rct th{padding:7px 6px}}
.upbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
#upFill{height:100%;width:0;background:var(--acc);transition:width .2s}
.ttwrap{display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px;align-items:start;margin-top:10px}
.ttree{position:sticky;top:calc(var(--phTop,0px) + 8px);max-height:calc(100vh - 24px);overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px;background:var(--card)}
.tthead{display:flex;gap:6px;align-items:center;padding:2px 2px 6px}
.ttq{flex:1;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:inherit;font:inherit;font-size:14px}
.ttE{display:flex;gap:4px;align-items:center;font-size:12px;white-space:nowrap}
.ttr{display:flex;align-items:center;border-radius:6px;min-height:32px}
.ttr:hover{background:rgba(127,127,127,.1)}
.ttr.on{background:color-mix(in srgb,var(--acc) 18%,transparent)}
.ttr.on .tn{font-weight:600}
.ttr .tw{width:22px;flex:none;border:0;background:none;color:inherit;cursor:pointer;padding:0;font-size:12px;opacity:.7}
.ttr .tn{flex:1;min-width:0;text-align:left;border:0;background:none;color:inherit;cursor:pointer;padding:6px 2px;font:inherit;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ttr .tc{font-size:12px;opacity:.6;padding:0 6px;white-space:nowrap}
.ttres .crumbs{margin-top:4px}
.ttopts{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 10px;font-size:13px}
.ttopts label{display:flex;gap:5px;align-items:center}
@media (max-width:700px){.ttwrap{display:block}.ttree{position:static;max-height:none;border:0;padding:0;background:none}.ttwrap.res .ttree,.ttwrap.tree .ttres{display:none}.ttr{min-height:42px}.ttr .tn{font-size:15px}}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px;margin:18px 0 8px;font-size:15px}
.crumbs .cr{border:0;background:none;color:var(--acc);cursor:pointer;padding:3px 4px;border-radius:6px;font:inherit}
.crumbs .cr:hover{background:var(--acc2);text-decoration:underline}
.crumbs .sep{color:var(--mute)}
.subtags{margin:-2px 0 10px}
.list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{padding:7px 12px;border-top:1px solid var(--line);cursor:pointer;display:flex;gap:10px;align-items:center;min-height:38px}
.row:first-child{border-top:0}.row:hover{background:var(--acc2)}
.row{-webkit-user-select:none;user-select:none}
.row.sel{background:var(--acc2)}
.row .cbw{flex:none;display:flex;align-items:center;justify-content:center;width:34px;margin:-7px 0 -7px -12px;padding:0 0 0 6px;align-self:stretch;cursor:pointer}
.row .cb{width:19px;height:19px;margin:0;accent-color:var(--acc);cursor:pointer}
.row .t{font-weight:600;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tg{flex:0 1 auto;max-width:42%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tg .chip{margin:0 0 0 4px}
.row .m{flex:none;color:var(--mute);font-size:12px;white-space:nowrap}
@media (max-width:600px){.row .tg{display:none}.row .m .nb{display:none}}
.row .s{color:var(--star)}
.chip{display:inline-block;background:var(--acc2);color:var(--acc);border-radius:999px;padding:1px 8px;font-size:12px;margin:2px 4px 0 0;border:0}
button.chip{cursor:pointer}
.stat{display:flex;gap:10px;flex-wrap:wrap}
.stat .box{flex:1;min-width:140px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.stat .n{font-size:24px;font-weight:700}
.muted{color:var(--mute)}
.note-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.note-head input.title{flex:1;min-width:200px;font-size:20px;font-weight:700;border:0;background:transparent;color:var(--ink);padding:4px 0}
.starbtn{font-size:22px;background:none;border:0;cursor:pointer;color:var(--mute)}.starbtn.on{color:var(--star)}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
iframe{width:100%;height:75vh;border:1px solid var(--line);border-radius:10px;background:#fff}
.atts a{display:inline-block;margin:3px 8px 3px 0;font-size:13px;color:var(--acc)}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:80}
.toast.on{opacity:.95}
.toast.undo{pointer-events:auto;display:flex;gap:14px;align-items:center}
.toast .ub{background:none;border:0;color:#8fe0b4;font-weight:700;cursor:pointer;padding:2px 4px;font-size:14px;text-transform:uppercase;letter-spacing:.4px}
@media (prefers-color-scheme:dark){.toast .ub{color:#1f6b45}}
textarea,.field{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.loading{padding:40px;text-align:center;color:var(--mute)}
/* selection action bar */
.actbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.08);padding:10px 14px;display:none}
.actbar.on{display:block}
.actbar .in{max-width:900px;margin:0 auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.actbar .cnt{font-weight:700;margin-right:6px}
/* tag tree (Tags page + panel) */
.tree{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 0}
.trow{display:flex;align-items:center;gap:6px;padding:5px 10px;min-height:34px}
.trow:hover{background:var(--acc2)}
.trow .tw{width:22px;height:22px;flex:none;border:0;background:none;cursor:pointer;color:var(--mute);font-size:12px;padding:0}
.trow .tw.leaf{visibility:hidden}
.trow .nm{flex:1;min-width:0;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .c{color:var(--mute);font-size:12px}
.trow .more{border:0;background:none;cursor:pointer;color:var(--mute);font-size:18px;padding:0 6px;visibility:hidden}
.trow:hover .more,.trow .more:focus{visibility:visible}
@media (hover:none){.trow .more{visibility:visible}}
.trow input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc);flex:none}
.trow .path{color:var(--mute);font-size:12px;margin-left:6px}
.trow .tadd{border:0;background:none;cursor:pointer;color:var(--acc);font-size:17px;line-height:1;padding:0 6px;opacity:.3;flex:none}
.trow:hover .tadd,.trow .tadd:focus{opacity:1}
@media (hover:none){.trow .tadd{opacity:.8}}
.trow.newrow{background:var(--acc2)}.trow.newrow .field{flex:1;min-width:0;padding:5px 8px;margin:0}
.ptop{border:1px dashed var(--acc);background:none;color:var(--acc);border-radius:8px;padding:5px 10px;cursor:pointer;font:inherit;font-size:13px;margin:6px 10px}
/* modal */
.shade{position:fixed;inset:0;background:var(--shade);z-index:65;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);color:var(--ink);border-radius:14px;width:100%;max-width:520px;max-height:86vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal .mh{padding:14px 16px 8px;font-weight:700}
.modal .mh small{display:block;font-weight:400;color:var(--mute);margin-top:2px}
.modal .mb{padding:0 16px 8px;overflow:auto;flex:1}
.modal .mf{padding:10px 16px 14px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center}
.modal .mf .grow{flex:1;color:var(--mute);font-size:13px}
.modal .tree{border:0;padding:0}
.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px}
@media (max-width:600px){.phgrid{grid-template-columns:repeat(3,1fr);gap:2px}}
.phsec{margin-top:14px}.phh{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;margin:0 0 6px;position:sticky;top:0;background:var(--bg);z-index:2;padding:4px 0;top:var(--phTop,0px)}
.phh input{width:18px;height:18px;accent-color:var(--acc);opacity:.5}.phh:hover input,.phh input:checked{opacity:1}
.pc{position:relative;aspect-ratio:1;background:var(--line);overflow:hidden;cursor:pointer}
.pc img{width:100%;height:100%;object-fit:cover;display:block}
.pc .pcb{position:absolute;top:6px;left:6px;width:22px;height:22px;accent-color:var(--acc);opacity:0;transition:opacity .1s}
.pc:hover .pcb,.phsel .pc .pcb,.pc.sel .pcb{opacity:.9}
@media (hover:none){.pc .pcb{opacity:.75}}
.pc.sel{outline:3px solid var(--acc);outline-offset:-3px}.pc.sel img{transform:scale(.9);transition:transform .1s}
.pc .pv{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;border-radius:6px;font-size:12px;padding:1px 6px}
.pc .pt{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.6);color:#fff;border-radius:6px;font-size:11px;padding:1px 6px;max-width:85%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phbar .tagsug{top:auto;bottom:calc(100% + 4px)}
.phbar{position:fixed;bottom:0;left:var(--phL,0px);right:0;z-index:55;background:var(--bg);padding:10px 64px 10px 14px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.15)}
body.phsel #main{padding-bottom:140px}
body.phsel .toast{bottom:calc(var(--phBarH,60px) + 14px)}
@media (max-width:600px){.phbar{padding-right:44px}}
.tagbox{position:relative;display:inline-block}.tagbox input{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;background:var(--card);color:var(--ink);width:180px}
.tagbox .tagsug{position:absolute;top:100%;left:0;z-index:70;min-width:260px}
.scrub{position:fixed;right:0;top:calc(var(--phTop,0px) + 16px);bottom:16px;width:58px;z-index:6;cursor:ns-resize;user-select:none;touch-action:none}
.scrub .yr{position:absolute;right:8px;font-size:11px;color:var(--mute);transform:translateY(-50%);pointer-events:none}
.scrub .bub{position:absolute;right:52px;background:var(--acc);color:#fff;font-size:13px;padding:3px 10px;border-radius:999px;white-space:nowrap;transform:translateY(-50%);display:none;pointer-events:none}
.scrub .knob{position:absolute;right:4px;width:30px;height:4px;border-radius:2px;background:var(--acc);transform:translateY(-50%);pointer-events:none}
.scrub:hover .bub,.scrub.drag .bub{display:block}
.wide.photosv{padding-right:62px}
@media (max-width:600px){.wide.photosv{padding-right:44px}.scrub{width:40px}.scrub .bub{right:38px}}
.phv{position:fixed;inset:0;z-index:60;background:#0b0b0d;display:flex;flex-direction:column;color:#eee}
.phv .top{display:flex;gap:8px;align-items:center;padding:10px 14px;flex-wrap:wrap}.phv .top .grow{flex:1}
.phmap{height:58vh;min-height:300px;border-radius:10px;overflow:hidden;margin-top:6px;background:#222;position:relative;z-index:0;isolation:isolate}
.phdot{background:#e8743b;border:2px solid #fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.phpin{background:none;border:none}.phpin img{width:44px;height:44px;object-fit:cover;border-radius:8px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5);background:#444}
.phpin span{position:absolute;right:3px;bottom:2px;color:#fff;font-size:11px;text-shadow:0 0 3px #000}
.phstar{background:rgba(0,0,0,.65);color:#fff;border-radius:10px;padding:2px 7px;font-size:12px;white-space:nowrap;width:auto!important;height:auto!important}
.pvloc{display:flex;gap:4px;flex-wrap:wrap;align-items:center}.pvloc .chip{color:#fff;border-color:rgba(255,255,255,.35);background:transparent;text-decoration:none;font-size:12px}
.phv .img{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
.phv .img img{max-width:100%;max-height:100%;object-fit:contain}
.phv .img iframe{width:calc(100% - 120px);height:100%;border:0;background:#000}
@media (max-width:700px){.phv .img iframe{width:100%}.phv .img:has(iframe) .nav{top:auto;bottom:8px;transform:none;height:44px}}
.phv .nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.12);border:0;color:#fff;font-size:28px;width:46px;height:64px;border-radius:10px;cursor:pointer}
.phv .nav.l{left:10px}.phv .nav.r{right:10px}
.phv .bot{padding:10px 14px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.phv .btn{background:rgba(255,255,255,.1);color:#eee;border-color:rgba(255,255,255,.2)}.phv .btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.phv .chip{background:rgba(255,255,255,.15);color:#fff}.phv .chip.ghost{background:none;border:1px dashed rgba(255,255,255,.35)}
.phv .tagbox input{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.25)}
.phv .tagsug{bottom:100%;top:auto}
.loc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px;margin:6px 0;font-size:13px;line-height:1.6}
.loc .acct{font-weight:600}.loc a{color:var(--acc);text-decoration:none}.loc a:hover{text-decoration:underline}.loc .sep{color:var(--mute);margin:0 3px}
.pp .pptree{max-height:min(46vh,340px);overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:6px}
.pp .trow.on{background:var(--acc);color:#fff}.pp .trow.on .tw,.pp .trow.on .path{color:#fff}
.pp .ppcur{font-size:13px;color:var(--mute);margin-bottom:6px}.pp .ppcur b{color:var(--ink)}
.recent{margin:2px 0 8px}
.sect{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--mute);margin:10px 0 4px}
.menu{position:fixed;z-index:40;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:4px 0;min-width:170px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 14px;cursor:pointer;font-size:14px}
.menu button:hover{background:var(--acc2)}
main.wide{max-width:1500px}
.split{display:grid;grid-template-columns:minmax(340px,38%) 1fr;gap:16px;align-items:start}
.split .lcol .row .tg{display:none}
.split .pcol{position:sticky;top:64px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.split .pcol iframe{height:calc(100vh - 250px);min-height:360px}

  var cab=S.notes.filter(function(n){return n.notebook==='Cabinet'});
  var tabs='<div class="tabs" id="cabTabs" style="margin:14px 0 4px">'+[['all','All'],['tag','By tag'],['drive','By Drive']].map(function(t){
    return '<button data-m="'+t[0]+'"'+(C.mode===t[0]?' class="on"':'')+'>'+t[1]+'</button>'}).join('')+'</div>';
  var body='';
  if(C.mode==='all'){ body=section('Cabinet ('+cab.length+')',byRecent(cab)); }
  else if(C.mode==='tag'){
    if(C.tag&&!S.parent.hasOwnProperty(C.tag)) C.tag='';
    body='<div class="ttwrap '+(C.tag?'res':'tree')+'"><div class="ttree" id="cabTree"></div><div class="ttres" id="cabRes"></div></div>';
  } else body='<div id="cabDrive"><p class="muted">Loading Drive folders…</p></div>';
  $('#main').innerHTML=tabs+body;
  $$('#cabTabs [data-m]').forEach(function(b){b.onclick=function(){C.mode=b.dataset.m;S.ttBack=null;viewCabinet()}});
  if(C.mode==='drive') drawCabDrive(cab); else if(C.mode==='tag') drawCabTag(cab); else bindRows();
}
function drawCabTag(cab){
  var C=S.cab, T=S.tt;
  if(!P.stats) phStats().then(function(){if(S.view==='cabinet'&&C.mode==='tag')drawCabTag(cab)}).catch(function(){});
  var direct={}; cab.forEach(function(n){n.tags.forEach(function(t){(direct[t]=direct[t]||[]).push(n)})});
  var ft=(P.stats&&P.stats.tags)||{}, memo={};
  function count(t){ if(memo[t]) return memo[t]; var seen={},nn=0,np=0;
    descendants(t).forEach(function(x){(direct[x]||[]).forEach(function(n){if(!seen[n.id]){seen[n.id]=1;nn++}});np+=ft[x]||0});
    return memo[t]=[nn,np] }
  function pick(t){C.tag=t;ttPicked(t,function(){C.tag='';viewCabinet()});viewCabinet();window.scrollTo(0,0)}
  mountTagTree($('#cabTree'),{sel:C.tag,q:C.q||'',count:count,pick:pick,onQ:function(v){C.q=v},allLabel:'All Cabinet notes'});
  var set={}; (C.tag?(T.exact?[C.tag]:descendants(C.tag)):[]).forEach(function(x){set[x]=1});
  var notes=C.tag?byRecent(cab.filter(function(n){return n.tags.some(function(g){return set[g]})})):byRecent(cab);
  var nPh=C.tag?(T.exact?(ft[C.tag]||0):count(C.tag)[1]):0, hasKids=C.tag&&(S.children[C.tag]||[]).length;
  var showN=T.what!=='photos'||!nPh, showP=nPh&&T.what!=='notes';
  $('#cabRes').innerHTML=(isNarrow()?'<button class="btn small" id="ttBk" style="margin-top:8px">‹ Tags</button>':'')+
    '<div class="crumbs">'+ttCrumbs(C.tag,'Cabinet','data-ct')+' <span class="muted">('+notes.length+' note'+(notes.length===1?'':'s')+(nPh?' · '+nPh+' photo'+(nPh===1?'':'s'):'')+')</span></div>'+
    '<div class="ttopts">'+(hasKids?'<label><input type="checkbox" id="ttEx"'+(T.exact?' checked':'')+'>Only “'+esc(C.tag)+'”, not its sub-tags</label>':'')+
      (notes.length&&nPh?'<span class="tabs" style="margin:0">'+[['both','Both'],['notes','Notes'],['photos','Photos']].map(function(w){return '<button data-w="'+w[0]+'"'+(T.what===w[0]?' class="on"':'')+'>'+w[1]+'</button>'}).join('')+'</span>':'')+
      newTagChip(C.tag)+'</div>'+
    (showN?(notes.length?'<div class="list">'+notes.map(rowHtml).join('')+'</div>':(nPh?'':'<p class="muted">Nothing in the Cabinet with this tag.</p>')):'')+
    (showP?'<div class="lhead" style="margin-top:16px"><h2>Photos ('+nPh+')</h2></div><div class="phgrid" id="cabPh"><p class="muted">Loading…</p></div>':'');
  if($('#ttBk')) $('#ttBk').onclick=function(){if(history.state&&history.state.tt)history.back();else{C.tag='';viewCabinet()}};
  $$('#cabRes [data-ct]').forEach(function(b){b.onclick=function(){pick(b.dataset.ct)}});
  if($('#ttEx')) $('#ttEx').onchange=function(){T.exact=this.checked;ttSave();drawCabTag(cab)};
  $$('#cabRes [data-w]').forEach(function(b){b.onclick=function(){T.what=b.dataset.w;ttSave();drawCabTag(cab)}});
  bindNewTag(viewCabinet); bindRows();
  if($('#cabPh')) call('api_photos',{tag:C.tag,exact:T.exact,limit:1500}).then(function(r){var g=$('#cabPh');if(!g)return;
    r.items.forEach(function(p){P.byId[p.id]=p}); P.secs=[{k:'',n:r.items.length,items:r.items}]; P.sel={};
    g.innerHTML=r.items.map(phCell).join(''); phBind(g)}).catch(function(){});
}
function linkTree(force){
  if(S.ltree&&!force&&Date.now()-S.ltree.t<300000) return Promise.resolve(S.ltree.v);
  return call('api_linkTree').then(function(v){S.ltree={t:Date.now(),v:v};return v});
}
function drawCabDrive(cab){
  var C=S.cab;
  linkTree().then(function(T){ if(S.view!=='cabinet'||C.mode!=='drive'||!$('#cabDrive')) return;
    // each linked Cabinet note → [account, folder, sub-folder, …]
    function pathOf(n){var info=T.notes[n.id]; if(!info) return null;
      var acct=info.drive?'Shared drives':(info.owner||'Unknown account'), segs=[], id=info.parent, g=0;
      while(id&&g++<20){var f=T.folders[id]; if(!f||!f.name) break; if(id===T.root) {break} segs.unshift({id:id,name:f.name}); id=f.parent}
      return [{id:'acct:'+acct,name:acct===T.me?acct+' (this account)':acct}].concat(segs)}
    var rows=cab.filter(function(n){return n.link}).map(function(n){return {n:n,p:pathOf(n)}}).filter(function(r){return r.p});
    var here=rows.filter(function(r){return C.path.every(function(id,i){return r.p[i]&&r.p[i].id===id})});
    if(C.path.length&&!here.length){C.path=[];here=rows}
    var kids={},order=[]; here.forEach(function(r){var c=r.p[C.path.length]; if(!c) return; if(!kids[c.id]){kids[c.id]={name:c.name,n:0};order.push(c.id)} kids[c.id].n++});
    order.sort(function(a,b){return kids[a].name.localeCompare(kids[b].name,undefined,{numeric:true})});
    var names=C.path.map(function(id,i){var r=here[0];return r&&r.p[i]?r.p[i].name:id});
    var list=byRecent(here.map(function(r){return r.n}));
    $('#cabDrive').innerHTML=(rows.length?'':'<p class="muted">No linked Drive files in the Cabinet yet. Link a folder from Inbox → 🔗 Link Drive files and its files are filed here.</p>')+
      (rows.length?'<div class="crumbs"><button class="cr" data-cp="-1">Drive</button>'+names.map(function(nm,i){return '<span class="sep">›</span>'+(i<names.length-1?'<button class="cr" data-cp="'+i+'">'+esc(nm)+'</button>':'<b>'+esc(nm)+'</b>')}).join('')+' <span class="muted">('+list.length+')</span>'+
        '<button class="btn small" id="cabRef" style="margin-left:auto" title="Re-read folders from Drive">↻</button></div>'+
        (order.length?'<div class="subtags">'+order.map(function(id){return '<button class="chip" data-cd="'+esc(id)+'">'+(C.path.length?'📁 ':'')+esc(kids[id].name)+' <span class="muted">'+kids[id].n+'</span></button>'}).join('')+'</div>':'')+
        '<div class="list">'+list.map(rowHtml).join('')+'</div>':'');
    $$('#cabDrive [data-cp]').forEach(function(b){b.onclick=function(){C.path=C.path.slice(0,+b.dataset.cp+1);drawCabDrive(cab)}});
    $$('#cabDrive [data-cd]').forEach(function(b){b.onclick=function(){C.path=C.path.concat([b.dataset.cd]);drawCabDrive(cab)}});
    if($('#cabRef')) $('#cabRef').onclick=function(){$('#cabDrive').innerHTML='<p class="muted">Reading folders from Drive…</p>';linkTree(true).then(function(){drawCabDrive(cab)})};
    bindRows();
  }).catch(function(){if($('#cabDrive'))$('#cabDrive').innerHTML='<p class="muted">Could not load Drive folders.</p>'});
}

var THUMBS={}; try{THUMBS=JSON.parse(localStorage.getItem('arnote.thumbs')||'{}')}catch(e){}
function thumbKey(n){return n.id+'|'+n.updated}
function shrink(src){return new Promise(function(res){var im=new Image();im.onload=function(){var w=240,h=Math.round(im.height*w/im.width)||300,c=document.createElement('canvas');c.width=w;c.height=Math.min(h,320);
  var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,w,h);try{res(c.toDataURL('image/jpeg',0.72))}catch(e){res(src)}};im.onerror=function(){res(src)};im.src=src})}
function thumbUrl(n){return THUMBS[thumbKey(n)]||''}
function loadThumbs(arr){
  var need=arr.filter(function(n){return !THUMBS[thumbKey(n)]}).slice(0,8); if(!need.length) return;
  call('api_thumbs',need.map(function(n){return n.id})).then(function(big){
    return Promise.all(need.map(function(n){return big[n.id]?shrink(big[n.id]).then(function(u){return [n.id,u]}):null})).then(function(pairs){
      var m={}; pairs.forEach(function(p){if(p)m[p[0]]=p[1]}); return m});
  }).then(function(m){
    need.forEach(function(n){if(m[n.id])THUMBS[thumbKey(n)]=m[n.id]});
    var keys=Object.keys(THUMBS); while(keys.length>80){delete THUMBS[keys.shift()]}
    try{localStorage.setItem('arnote.thumbs',JSON.stringify(THUMBS))}catch(e){THUMBS={}}
    need.forEach(function(n){var c=document.querySelector('.ncard[data-open="'+n.id+'"] .th');if(c&&m[n.id])c.innerHTML='<img alt="" src="'+m[n.id]+'">'});
  }).catch(function(){});
}
function cardHtml(n){
  return '<div class="ncard" data-open="'+n.id+'"><div class="nbk">'+esc(n.notebook)+(n.starred?' · <span class="s" style="color:var(--star)">★</span>':'')+'</div>'+
    '<div class="tt">'+(n.link?'🔗 ':'')+esc(n.title)+'</div>'+
    '<div class="tgs">'+n.tags.slice(0,2).map(function(t){return '<span class="chip">'+esc(t)+'</span>'}).join('')+(n.tags.length>2?'<span class="muted" style="font-size:12px"> +'+(n.tags.length-2)+'</span>':'')+'</div>'+
    '<div class="th">'+(thumbUrl(n)?'<img alt="" src="'+thumbUrl(n)+'">':'<div class="ph">'+esc((n.title||'?')[0])+'</div>')+'</div>'+
    '<div class="dt">'+fmt(n.updated||n.created)+(n.att?' · 📎'+n.att:'')+'</div></div>';
}
function miniList(arr){return '<ul class="mini">'+arr.map(function(n){return '<li data-open="'+n.id+'"><span class="t">'+(n.starred?'<span style="color:var(--star)">★</span> ':'')+esc(n.title)+'</span><span class="d">'+fmt(n.updated||n.created)+'</span></li>'}).join('')+'</ul>'}

/** Inbox preview of a receipt: just the details and the picture; the full email/note is one tap away. */
function pvReceipt(n){
  var get=S.rcData?Promise.resolve(S.rcData):call('api_receipts').then(function(d){S.rcData=d;return d});
  get.then(function(d){var el=$('#pvRcCard');if(!el||S.pv!==n.id)return;

/** Phone photos arrive as IMG_20261021_095512.jpg and the like: give them a readable name instead. */
function photoName(f){
  var ext=(f.name.match(/\.[A-Za-z0-9]{2,5}$/)||['.jpg'])[0];
  if(!/^image\//.test(f.type||'')) return f.name;
  if(!/^(IMG|PXL|DSC|DCIM|MVIMG|Screenshot|image|photo)?[_ -]?\d{6,}|^IMG[_-]|^PXL[_-]|^image\.\w+$/i.test(f.name)) return f.name;
  var d=new Date(f.lastModified||Date.now());
  return 'Photo '+d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})+' '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})+ext;
}

/* tag order: pinned top-level tags come first (in your order); under a parent, ↑ ↓ set the order */
function tagOrderItems(t){var p=S.parent[t]||'', pinned=!!(S.tagOrd||{})[t];
  if(!p) return (pinned?'<button data-a="up">↑ Move up</button><button data-a="down">↓ Move down</button><button data-a="unpin">Unpin from top</button>':'<button data-a="pin">📌 Keep at top</button>');
  return '<button data-a="up">↑ Move up</button><button data-a="down">↓ Move down</button>'}
function tagOrderDo(t,a){
  var p=S.parent[t]||'', sibs=(S.children[p]||[]).slice(), ord=S.tagOrd||{};
  var list=p?sibs:sibs.filter(function(x){return ord[x]});                   // top level: only the pinned ones have an order
  var i=list.indexOf(t);
  if(a==='pin'&&i<0) list.push(t);
  else if(a==='unpin') list=list.filter(function(x){return x!==t});
  else if(a==='up'&&i>0){list.splice(i,1);list.splice(i-1,0,t)}
  else if(a==='down'&&i>=0&&i<list.length-1){list.splice(i,1);list.splice(i+1,0,t)}
  else return;
  var pos={};list.forEach(function(x,k){pos[x]=k+1});
  S.tags.forEach(function(x){if((S.parent[x.name]||'')===p)x.order=pos[x.name]||0});
  setTags(S.tags); rerender();
  call('api_tagOrder',p,list).catch(function(e){toast(e.message)});
}

/* ---------- search ---------- */
var qTimer, qSeq=0;
$('#q').addEventListener('input',function(){clearTimeout(qTimer);qTimer=setTimeout(runSearch,250)});
$('#q').addEventListener('keydown',function(e){if(e.key==='Enter'){clearTimeout(qTimer);runSearch()}});
function runSearch(){
  var raw=$('#q').value.trim(); if(!raw){go('home');return}
  S.lastList=null;
  var words=[],tagF=[],nb=null;
  raw.split(/\s+/).forEach(function(w){
    if(/^in:/i.test(w)) nb=w.slice(3).toLowerCase();
    else if(w[0]==='#'&&w.length>1) tagF.push(w.slice(1).toLowerCase());
    else words.push(w.toLowerCase());
  });
  var tagSets=tagF.map(function(f){var hits=S.tags.filter(function(t){return t.name.toLowerCase().indexOf(f)>=0}),set={};hits.forEach(function(h){descendants(h.name).forEach(function(x){set[x]=1})});return set});
  function base(n){ if(nb&&n.notebook.toLowerCase()!==nb) return false; return tagSets.every(function(set){return n.tags.some(function(g){return set[g]})}); }
  var local=S.notes.filter(function(n){ if(!base(n))return false; var hay=(n.title+' '+n.tags.join(' ')).toLowerCase(); return words.every(function(w){return hay.indexOf(w)>=0}) });

        h+='<div class="sgt'+(has?' has':'')+'" style="padding-left:'+(4+d*16)+'px"><span class="tw" data-tw="'+esc(t)+'">'+(kids?(op?'▾':'▸'):'')+'</span><span class="nm" data-t="'+esc(t)+'">'+esc(t)+(has?' ✓':'')+'</span></div>';

      return}
    var names=S.tags.map(function(t){return t.name}).filter(function(t){return n.tags.indexOf(t)<0&&t.toLowerCase().indexOf(q)>=0});

}

  if(ch.status!==undefined) P.sel={};
  var pr=call('api_photoUpdate',ids,ch);
  function redraw(){phRedraw(Object.keys(before));phPaint();if(after)after();phStats(true).then(function(){if(S.view==='photos'&&$('#phTabs'))phTop()})}
  redraw();
  undoToast(msg+(ids.length>1?' ('+ids.length+')':''),function(){return pr.then(function(){
    var groups={};Object.keys(before).forEach(function(id){var p=P.byId[id],b=before[id];if(!p)return;
      var c={addTags:b.tags.filter(function(t){return p.tags.indexOf(t)<0}),removeTags:p.tags.filter(function(t){return b.tags.indexOf(t)<0})};
      if(p.status!==b.status)c.status=b.status;var k=JSON.stringify(c);(groups[k]=groups[k]||[]).push(id)});
    return Promise.all(Object.keys(groups).map(function(k){var c=JSON.parse(k);groups[k].forEach(function(id){var p=P.byId[id];p.tags=before[id].tags.slice();p.status=before[id].status});return call('api_photoUpdate',groups[k],c)}));
  }).then(function(){if(S.view==='photos')viewPhotos()})});
}
/** Redraw changed photos: update their tag labels, and drop ones that no longer belong in this view. */
function phRedraw(ids){
  var q=phQ(), set=q.tag?(function(){var s={};(q.exact?[q.tag]:descendants(q.tag)).forEach(function(x){s[x]=1});return s})():null;
  ids.forEach(function(id){var p=P.byId[id];if(!p)return;
    var keep=!(set&&!p.tags.some(function(g){return set[g]}));   // in Untagged, newly tagged photos stay until the next load so more tags can be added
    $$('#phTL .pc[data-id="'+id+'"], #cabPh .pc[data-id="'+id+'"]').forEach(function(c){
      var ps=c.closest('.phsec');
      if(!keep){phDropCell(c,id);return}
      var pt=c.querySelector('.pt'); if(p.tags.length){if(!pt){pt=document.createElement('span');pt.className='pt';c.appendChild(pt)}pt.textContent=p.tags.join(', ')} else if(pt) pt.remove();
    })});
}
function phDropCell(c,id){var ps=c.closest('.phsec');
  if(ps){var sec=P.secs[+ps.dataset.i];if(sec&&sec.items){sec.items=sec.items.filter(function(x){return x.id!==id});sec.n=sec.items.length;
    var h=ps.querySelector('.phh .muted');if(h)h.textContent=sec.n}}
  c.remove(); delete P.sel[id];}
document.addEventListener('keydown',function(e){if(e.key!=='Escape'||S.view!=='photos'||$('#phv')||$('.modal'))return;
  var tg=(e.target.tagName||'').toLowerCase(); if(tg==='input'&&e.target.id!=='pbIn') return;
  if(Object.keys(P.sel).length){P.sel={};phPaint()}});
/** Delete photos: they vanish at once, Undo for a few seconds, then the files go to Drive trash (restorable there for 30 days). */
S.pendingPhTrash=[];
function phDelete(ids){
  ids=ids.filter(function(id){return P.byId[id]}); if(!ids.length) return;
  ids.forEach(function(id){$$('#phTL .pc[data-id="'+id+'"], #cabPh .pc[data-id="'+id+'"]').forEach(function(c){phDropCell(c,id)})});
  P.sel={}; phPaint();
  var job={ids:ids,done:false}; S.pendingPhTrash.push(job);
  function settle(){job.done=true;S.pendingPhTrash=S.pendingPhTrash.filter(function(j){return j!==job})}
  function commit(){if(job.done)return;settle();call('api_photoDelete',ids).then(function(){return phStats(true)}).then(function(){if(S.view==='photos'&&$('#phTabs'))phTop()}).catch(function(){})}
  var u=undoToast('Deleted '+(ids.length>1?ids.length+' photos':'photo'),function(){settle();return phStats(true).then(function(){if(S.view==='photos'||S.view==='cabinet')rerender()})},6000);
  u.onExpire=commit;
}
window.addEventListener('pagehide',function(){(S.pendingPhTrash||[]).forEach(function(j){if(j.done)return;j.done=true;
  try{fetch(CFG.api,{method:'POST',keepalive:true,body:JSON.stringify({k:CFG.key,fn:'api_photoDelete',a:[j.ids]})})}catch(e){}})});
window.addEventListener('popstate',function(){if(P.popSkip){P.popSkip=0;return}var v=$('#phv');if(v&&v._close)v._close(true)});
/** Full-screen viewer: ← → (or swipe), type a tag, F files, Esc closes. */
function phViewer(id,swapping){
  var old=$('#phv'); if(old) old.remove();
  if(!swapping||!(history.state&&history.state.phv)) history.pushState({phv:1},'');   // phone/browser Back closes the photo and leaves you where you were
  var p=P.byId[id]; if(!p) return; var flat=phFlat(), i=flat.findIndex(function(x){return x.id===id});
  var v=document.createElement('div'); v.className='phv'; v.id='phv';
  var d=p.taken?new Date(p.taken):null, isVid=/^video/.test(p.mime);
  v.innerHTML='<div class="top"><b style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:50vw">'+esc(p.name)+'</b><span style="opacity:.7;font-size:13px">'+(d&&!isNaN(d)?d.toLocaleDateString(undefined,{weekday:'short',year:'numeric',month:'short',day:'numeric'}):'')+(p.folder?' · '+esc(p.folder):'')+'</span><span id="pvLoc" class="pvloc"></span><span class="grow"></span><span id="pvInfo" style="opacity:.6;font-size:12px"></span><a class="btn small" id="pvOpen" target="_blank" href="https://drive.google.com/file/d/'+encodeURIComponent(id)+'/view'+(S.user?'?authuser='+encodeURIComponent(S.user):'')+'">Open in Drive ↗</a><button class="btn small" id="pvX">✕</button></div>'+
    '<div class="img">'+(isVid?'<iframe id="pvVid" src="https://drive.google.com/file/d/'+encodeURIComponent(id)+'/preview'+(S.user?'?authuser='+encodeURIComponent(S.user):'')+'" allow="autoplay; fullscreen" allowfullscreen></iframe>':'<img id="pvImg" src="'+(P.thumbs[id]||phThumbUrl(id,400))+'">')+(i>0?'<button class="nav l" id="pvL">‹</button>':'')+(i<flat.length-1?'<button class="nav r" id="pvR">›</button>':'')+'</div>'+
    '<div class="bot"><span id="pvTags"></span><span class="tagbox"><input id="pvIn" placeholder="Add tag (T)" autocomplete="off"><div class="tagsug" id="pvSug"></div></span><span id="pvRec"></span>'+
    '<button class="btn small" id="pvDel" title="Delete (Del)">🗑 Delete</button></div>';
  document.body.appendChild(v);
  function tags(){var q=P.byId[id];$('#pvTags').innerHTML=q.tags.map(function(t){return '<button class="chip" data-x="'+esc(t)+'" title="Remove">'+esc(t)+' ✕</button>'}).join(' ');
    $$('#pvTags [data-x]').forEach(function(b){b.onclick=function(){phUpdate([id],{removeTags:[b.dataset.x]},'Removed “'+b.dataset.x+'”',tags)}});
    var rec=(store('recentTags')||[]).filter(function(t){return S.parent.hasOwnProperty(t)&&q.tags.indexOf(t)<0}).slice(0,5);
    $('#pvRec').innerHTML=rec.map(function(t){return '<button class="chip ghost" data-r="'+esc(t)+'">+ '+esc(t)+'</button>'}).join(' ');
    $$('#pvRec [data-r]').forEach(function(b){b.onclick=function(){rememberTags([b.dataset.r]);phUpdate([id],{addTags:[b.dataset.r]},'Tagged “'+b.dataset.r+'”',tags)}})}
  tags();
  tagInput($('#pvIn'),$('#pvSug'),function(t){rememberTags([t]);phUpdate([id],{addTags:[t]},'Tagged “'+t+'”',tags);setTimeout(function(){var x=$('#pvIn');if(x)x.focus()},50)});
  // full-size picture straight from Drive; the server version if the browser can't
  if(!isVid){var big=new Image(); big.onload=function(){var im=$('#pvImg');if(im&&document.body.contains(v))im.src=big.src};
  big.onerror=function(){call('api_photoView',id).then(function(r){var im=$('#pvImg');if(im&&r.src)im.src=r.src}).catch(function(){})};
  big.src=phThumbUrl(id,2000);}
  call('api_photoView',id,true).then(function(r){if(!document.body.contains(v))return;$('#pvInfo').textContent=r.camera||''}).catch(function(){});
  // where it was taken: town (tap to see every photo from there), your named place, and "Save as a place"
  (function(){var lat=+p.lat,lng=+p.lng; if(typeof p.lat!=='number'||!isFinite(lat)) return;
    phPlaces().then(function(){var el=$('#pvLoc');if(!el||!document.body.contains(v))return;var nm=phNamedAt(lat,lng);
      el.innerHTML=(nm?'<button class="chip ghost" data-gl="'+esc(JSON.stringify({named:nm}))+'" title="All photos at this place">⭐ '+esc(nm)+'</button>':'')+
        (p.town?'<button class="chip ghost" data-gl="'+esc(JSON.stringify({region:p.region,town:p.town}))+'" title="All photos from this town">📍 '+esc(p.town)+(p.region?', '+esc(p.region):'')+'</button>':'<span style="opacity:.7;font-size:12px">📍 town being looked up</span>')+
        '<button class="chip ghost" id="pvMap" title="Show on the ArNote map">🗺 Map</button>'+
        (nm?'':'<button class="chip ghost" id="pvSp">＋ Save as a place</button>');
      $$('#pvLoc [data-gl]').forEach(function(b){b.onclick=function(){var pl=JSON.parse(b.dataset.gl);close();P.tab='place';P.pl=pl;P.q='';viewPhotos();window.scrollTo(0,0)}});
      if($('#pvSp')) $('#pvSp').onclick=function(){phSavePlace(lat,lng,p.town)};
      $('#pvMap').onclick=function(){close();P.tab='map';P.box=null;P.mapView={c:{lat:lat,lng:lng},z:17};viewPhotos();window.scrollTo(0,0)};
    }).catch(function(){})})();
  [flat[i+1],flat[i-1]].forEach(function(n){if(n){var pre=new Image();pre.src=phThumbUrl(n.id,2000)}});   // ready before you get there
  function swap(){v.remove();document.removeEventListener('keydown',key)}
  function close(fromBack){if(!document.body.contains(v))return;swap();if(!fromBack&&history.state&&history.state.phv){P.popSkip=1;history.back()}}
  v._close=close;
  function go2(j){var f=phFlat();if(j<0)return;if(j>=f.length){var nx=P.secs.findIndex(function(s){return !s.items});if(nx>=0)phLoadSec(nx).then(function(){go2(j)});return}swap();phViewer(f[j].id,true)}
  function key(e){var tg=(e.target.tagName||'').toLowerCase();if(tg==='input')return;
    if(e.key==='Escape')close();else if(e.key==='ArrowLeft')go2(i-1);else if(e.key==='ArrowRight')go2(i+1);
    else if(e.key==='t'||e.key==='T'){e.preventDefault();$('#pvIn').focus()}
    else if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();$('#pvDel').click()}}
  document.addEventListener('keydown',key);
  $('#pvX').onclick=close; if($('#pvL'))$('#pvL').onclick=function(){go2(i-1)}; if($('#pvR'))$('#pvR').onclick=function(){go2(i+1)};
  var sx=null; $('#phv .img').addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});
  $('#phv .img').addEventListener('touchend',function(e){if(sx==null)return;var dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>60)go2(dx<0?i+1:i-1)});
  $('#pvDel').onclick=function(){var nextI=i;phDelete([id]);var f=phFlat();if(!f.length){close();return}swap();phViewer(f[Math.min(nextI,f.length-1)].id,true)};
}

/* ---------- pairing ---------- */
function parsePair(s){
  s=String(s||'').trim(); var m=s.match(/#pair=([A-Za-z0-9_-]+)/); var b=m?m[1]:(/^[A-Za-z0-9_-]{40,}$/.test(s)?s:'');
  if(!b) return null;
  try{var t=atob(b.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((b.length+3)%4));var i=t.lastIndexOf('|');if(i<0)return null;
    return {api:t.slice(0,i),key:t.slice(i+1)}}catch(e){return null}
}
function showPair(msg){
  document.body.classList.add('unpaired');
  $('#main').innerHTML='<div class="pair"><h1>ArNote</h1><span class="tagline">Tag — you\'re it.</span><p class="muted" style="margin:0">Connect this device to your notes.</p>'+
    '<label>Paste your pairing link</label><input class="field" id="plink" placeholder="https://…#pair=…" autocomplete="off">'+
    '<details style="margin-top:10px"><summary class="muted" style="cursor:pointer;font-size:13px">Or enter server address and key</summary>'+
    '<label>Server address (Apps Script web app URL)</label><input class="field" id="papi" placeholder="https://script.google.com/macros/s/…/exec">'+
    '<label>Private key</label><input class="field" id="pkey" autocomplete="off"></details>'+
    '<div class="err" id="perr">'+esc(msg||'')+'</div><button class="btn primary" id="pgo" style="margin-top:6px">Connect</button>'+
    '<p class="muted" style="font-size:12px;margin-top:16px">New to ArNote? Your notes live in your own Google Drive. See <a href="https://github.com/mtnst8/ArNote#set-up-your-own-arnote" target="_blank">how to set up your own</a>.</p></div>';
  $('#pgo').onclick=function(){var c=parsePair($('#plink').value)||(($('#papi').value.trim()&&$('#pkey').value.trim())?{api:$('#papi').value.trim(),key:$('#pkey').value.trim()}:null);
    if(!c){$('#perr').textContent='That doesn\'t look like a pairing link.';return}
    tryPair(c)};
}
function tryPair(c){
  if($('#perr')) $('#perr').textContent='Connecting…';
  rawCall(c,'api_appInfo',[]).then(function(){saveCfg(c);start()}).catch(function(e){if($('#perr'))$('#perr').textContent='Could not connect: '+e.message;else showPair('Could not connect: '+e.message)});
}
function start(){
  document.body.classList.remove('unpaired');
  $('#main').innerHTML='<div class="loading">Loading notes…</div>';
  Promise.all([load().catch(function(e){S.loadErr=e}),call('api_appInfo').then(function(i){DROP_URL=i.dropUrl||'';LINK_URL=i.linkUrl||'';if(i.user)S.user=i.user;S.lic=i.licence||null;S.build=i.build}).catch(function(){})]).then(function(){
    if(S.lic&&!S.lic.ok){showEnded();return}
    if(S.loadErr) throw S.loadErr;
    if(location.search.indexOf('share=1')>=0) receiveShare(); else go('home');
  });
}
/** This copy is no longer on Brian's list: say so plainly; everything is still in their Drive. */
function showEnded(){
  $('#main').innerHTML='<div class="pair"><h1>ArNote</h1><p style="font-size:16px"><b>ArNote access has ended for this account.</b></p>'+
    '<p class="muted">Nothing has been deleted: your notes are Google Docs in the <b>ArNote</b> folder of your Google Drive, your photos are in <b>ArNote Photos</b>, and the index is the ArNote spreadsheet. You can open all of them in Google Drive any time.</p>'+
    '<p class="muted">If you think this is a mistake, contact the person who invited you.</p><a class="btn" href="https://drive.google.com" target="_blank">Open Google Drive</a></div>';
}
/* ---------- things shared into ArNote from other apps (Android share sheet) ---------- */
function receiveShare(){
  history.replaceState(null,'',location.pathname);
  caches.open('arnote-share').then(function(c){return c.match('shared').then(function(r){return r?r.json():null}).then(function(meta){
    if(!meta){go('inbox');return}
    return Promise.all((meta.files||[]).map(function(f,i){return c.match('file-'+i).then(function(r){return r.blob()}).then(function(b){return new File([b],f.name,{type:f.type})})})).then(function(files){
      c.delete('shared'); (meta.files||[]).forEach(function(f,i){c.delete('file-'+i)});
      S.view='inbox'; go('inbox');
      var text=[meta.title,meta.text,meta.url].filter(Boolean).join('\n');
      var media=files.length&&files.every(function(f){return /^(image|video)\//.test(f.type)});
      if(media){ go('photos');
        modal('Add '+files.length+' to Photos?','You shared '+(files.length>1?files.length+' photos/videos':'a photo or video')+' with ArNote.','<p class="muted" style="margin:0">Photos go to your gallery. Make notes instead if these are things to keep as notes.</p>',
          '<button class="btn" id="shNote">Make notes</button><span class="grow"></span><button class="btn primary" id="shPh">Add to Photos</button>');
        $('#shPh').onclick=function(){closeModal();phAddFiles(files)};
        $('#shNote').onclick=function(){closeModal();go('inbox');uploadFiles(files)};
      }
      else if(files.length) uploadFiles(files);
      else if(text) call('api_createNote',(meta.title||meta.text||'Shared').split('\n')[0].slice(0,90),text,[]).then(function(){return load()}).then(function(){toast('Saved to Inbox');go('inbox')});
    });
  })}).catch(function(){go('inbox')});
}
(function boot(){
  var sh=parseShare(location.hash);
  if(sh){history.replaceState(null,'',location.pathname);
    if(!CFG) try{localStorage.setItem('arnote.share',JSON.stringify(sh))}catch(e){}
    guestStart(sh,CFG?(CFG.api===sh.api?'self':'other'):'');return;
  }
  if(!CFG){var saved=null;try{saved=JSON.parse(localStorage.getItem('arnote.share')||'null')}catch(e){}if(saved&&saved.token){guestStart(saved,false);return}}
  var c=parsePair(location.hash);
  if(c){history.replaceState(null,'',location.pathname+location.search);tryPair(c);return}
  if(CFG) start(); else showPair();
})();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
window.addEventListener('focus',function(){ if(S.editing&&S.view==='note'&&S.byId[S.editing]){var f=$('#nbody .reader');if(f)fillReader(f,S.editing,true)} });
</script>
